name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the 48 3D gun packs
        run: python3 gen.py

      - name: Zip standalone resource packs
        run: |
          mkdir -p packs-out
          for d in src/main/resources/resourcepacks/*/; do
            n=$(basename "$d")
            (cd "$d" && zip -qr "../../../../../packs-out/gunbow_$n.zip" .)
          done

      - name: Upload standalone resource packs (works without the mod)
        uses: actions/upload-artifact@v4
        with:
          name: gunbow-resourcepacks
          path: packs-out/*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build the mod jar
        run: gradle build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: gunbow-jar
          path: build/libs/*.ja
